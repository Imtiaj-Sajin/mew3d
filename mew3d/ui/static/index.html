<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mew3D Studio</title>
<script type="module" src="/static/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --accent2: #bc8cff;
    --good: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-rows: 52px 1fr;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .logo { font-weight: 700; font-size: 17px; }
  header .logo span { color: var(--accent); }
  #statusDot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
  #statusDot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #statusText { color: var(--dim); font-size: 12px; }

  main { display: grid; grid-template-columns: 320px 1fr 300px; min-height: 0; }
  .panel { border-right: 1px solid var(--border); overflow-y: auto; }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }

  /* ---- left: inputs ---- */
  #left { padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
  label.head { font-size: 11px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
  textarea {
    width: 100%; height: 74px; resize: vertical; padding: 10px; border-radius: 8px;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); font: inherit;
  }
  #drop {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 18px 10px;
    text-align: center; color: var(--dim); cursor: pointer; transition: .15s;
  }
  #drop.armed, #drop:hover { border-color: var(--accent); color: var(--text); }
  #drop img { max-width: 100%; max-height: 130px; border-radius: 8px; }
  select, .num {
    width: 100%; padding: 8px 10px; border-radius: 8px; background: var(--panel2);
    color: var(--text); border: 1px solid var(--border); font: inherit;
  }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 8px; color: var(--dim); cursor: pointer; }
  #goBtn {
    padding: 12px; border: none; border-radius: 10px; cursor: pointer; font: 600 15px/1 inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  }
  #goBtn:disabled { opacity: .45; cursor: not-allowed; }
  #guardMsg { color: var(--bad); font-size: 12px; min-height: 16px; }

  /* ---- center: viewer + agent theater ---- */
  #center { position: relative; display: flex; flex-direction: column; min-width: 0; }
  model-viewer { width: 100%; flex: 1; background: radial-gradient(ellipse at 50% 40%, #1a2233 0%, var(--bg) 70%); }
  #viewerHint { position: absolute; bottom: 74px; left: 50%; transform: translateX(-50%);
    color: var(--dim); font-size: 12px; pointer-events: none; }
  /* ---- lighting bar ---- */
  #lightBar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px;
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(to top, rgba(13,17,23,.96), rgba(13,17,23,0));
  }
  #lightMsg { flex: 1; font-size: 13px; color: var(--dim); min-height: 34px; }
  #lightMsg b { color: var(--accent2); }
  #lightMsg .live::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #envToggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #envToggle button {
    background: var(--panel); color: var(--dim); border: 0; padding: 7px 13px;
    font: 12px inherit; cursor: pointer;
  }
  #envToggle button.on { background: var(--accent2); color: #fff; font-weight: 600; }
  #envToggle button:disabled { opacity: .4; cursor: wait; }
  .chips { display: flex; gap: 5px; }
  .chip { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #ffffff30; }
  /* ---- studio tool rail + panels ---- */
  #toolRail { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px; }
  #toolRail button {
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 15px;
    background: rgba(22,27,34,.9); border: 1px solid var(--border); color: var(--text);
  }
  #toolRail button:hover { border-color: var(--accent); }
  .card {
    position: absolute; top: 14px; right: 58px; width: 230px; display: none;
    background: rgba(22,27,34,.97); border: 1px solid var(--border); border-radius: 11px;
    padding: 12px; flex-direction: column; gap: 7px; z-index: 5;
  }
  .card.open { display: flex; }
  .cardHead { display: flex; justify-content: space-between; font-weight: 600; font-size: 13px; }
  .cardHead span { cursor: pointer; color: var(--dim); }
  .card img { width: 100%; border-radius: 7px; background: #0b0e13; }
  .card input[type=range] { width: 100%; accent-color: var(--accent2); }
  .tgl { display: flex; gap: 7px; align-items: center; color: var(--dim); font-size: 12px; cursor: pointer; }
  .dimNote { color: var(--dim); font-size: 11px; }
  .mats { display: flex; flex-wrap: wrap; gap: 6px; }
  .mat {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; box-shadow: inset 0 -4px 8px #0006;
  }
  .mat.on { border-color: var(--accent2); }
  #theater {
    position: absolute; inset: 0; background: rgba(13,17,23,.96); display: none;
    flex-direction: column; padding: 18px 12% 12px;
  }
  #theater.open { display: flex; }
  #theater h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin-bottom: 10px; }
  #feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 6px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; max-width: 92%; animation: fadein .25s;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(5px); } }
  .bubble .who { font-size: 12px; font-weight: 700; color: var(--accent); }
  /* the line an agent is working on right now: dim/bright sweep + trailing dots */
  .bubble.working { border-color: var(--accent); box-shadow: 0 0 0 1px #58a6ff22; }
  .bubble.working .txt {
    background: linear-gradient(90deg, #6d7681 0%, #ffffff 25%, #6d7681 50%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: sweep 1.8s linear infinite;
  }
  @keyframes sweep { from { background-position: 150% 0 } to { background-position: -150% 0 } }
  .bubble.working .dots::after {
    content: ""; animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }
  .bubble.working .who::before {
    content: "●"; margin-right: 5px; font-size: 8px; color: var(--accent);
    display: inline-block; animation: breathe 1.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .2; transform: scale(.8) } 50% { opacity: 1; transform: scale(1.15) } }

  /* ---- question card: an agent is waiting on the operator ---- */
  .qcard {
    border: 1px solid var(--accent2); background: #1d1930; border-radius: 12px;
    padding: 13px 15px; animation: fadein .25s; box-shadow: 0 0 0 3px #bc8cff1a;
  }
  .qcard .who { font-size: 12px; font-weight: 700; color: var(--accent2); margin-bottom: 5px; }
  .qcard .qtext { margin-bottom: 10px; }
  .qcard .qshots { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .qcard .qshots img { height: 92px; border-radius: 7px; background: #0b0e13; }
  .qcard model-viewer { width: 100%; height: 210px; border-radius: 8px; background: #10141b; margin-bottom: 10px; }
  .qbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .qbtns button {
    padding: 8px 15px; border-radius: 8px; cursor: pointer; font: 600 13px inherit;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .qbtns button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .qbtns button:hover { border-color: var(--accent); }
  .qcard.answered { opacity: .55; border-color: var(--border); box-shadow: none; }
  .qtimer { color: var(--dim); font-size: 11px; margin-top: 7px; }
  .bubble.narr { border-color: var(--accent2); background: #1d1930; align-self: flex-end; }
  .bubble.narr .who { color: var(--accent2); }
  .bubble.err { border-color: var(--bad); }
  .bubble.err .who { color: var(--bad); }
  .bubble img { max-height: 110px; border-radius: 6px; margin-top: 6px; margin-right: 6px; }
  .sys { color: var(--dim); font-size: 12px; text-align: center; }
  #theaterBar { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; }
  .ghostBtn {
    background: none; border: 1px solid var(--border); color: var(--dim); padding: 7px 14px;
    border-radius: 8px; cursor: pointer; font: inherit;
  }
  .ghostBtn:hover { color: var(--text); border-color: var(--accent); }

  /* ---- right: versions ---- */
  #right { background: var(--panel); padding: 12px; }
  #right h2 { font-size: 12px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; padding: 4px 4px 10px; }
  .run {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; margin-bottom: 10px;
  }
  .run .title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .meta { color: var(--dim); font-size: 11px; margin: 2px 0 8px; display: flex; gap: 8px; align-items: center; }
  .score { padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #06131f; }
  .models { display: flex; flex-wrap: wrap; gap: 6px; }
  .mbtn {
    padding: 4px 10px; border-radius: 16px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .mbtn:hover, .mbtn.active { border-color: var(--accent); color: var(--accent); }
  .mbtn.tex { border-color: var(--accent2); color: var(--accent2); }
  .thumbs { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
  .thumbs img { height: 44px; border-radius: 5px; }
  .running-tag { color: var(--warn); font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="logo">Mew<span>3D</span> Studio</div>
  <div id="statusDot"></div><div id="statusText">idle</div>
</header>
<main>
  <div id="left" class="panel">
    <div>
      <label class="head">Describe your object</label>
      <textarea id="prompt" placeholder="a cute baby dragon&#10;(text, image, or both)"></textarea>
    </div>
    <div>
      <label class="head">Or drop an image</label>
      <div id="drop">click / drop image here</div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
    <div class="row">
      <div>
        <label class="head">3D model</label>
        <select id="backend">
          <option value="hunyuan" selected>Hunyuan (quality)</option>
          <option value="triposr">TripoSR (fast)</option>
          <option value="both">Both (compare)</option>
        </select>
      </div>
      <div>
        <label class="head">Candidates</label>
        <select id="candidates"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="texture" checked> paint texture (takes minutes)</label>
    <button id="goBtn">✦ Generate 3D</button>
    <div id="guardMsg"></div>
  </div>

  <div id="center">
    <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1"
                  exposure="0.9" interaction-prompt="none"></model-viewer>
    <div id="viewerHint">drag to orbit · scroll to zoom</div>

    <div id="toolRail">
      <button title="Environment settings" onclick="togglePanel('envPanel')">☀</button>
      <button title="View settings" onclick="togglePanel('viewPanel')">🎛</button>
      <button title="View reference" onclick="togglePanel('refPanel')">🖼</button>
    </div>

    <div class="card" id="envPanel">
      <div class="cardHead">Environment<span onclick="togglePanel('envPanel')">✕</span></div>
      <img id="envPreview" alt="environment">
      <label class="head">Surrounding</label>
      <select id="envPreset" onchange="setPreset(this.value)">
        <option value="ai">✨ AI designed</option>
        <option value="studio">Studio</option>
        <option value="sunset">Sunset</option>
        <option value="night">Night neon</option>
        <option value="soft">Soft daylight</option>
        <option value="off">Off (flat neutral)</option>
      </select>
      <label class="head">Strength <span id="envStrengthVal">1.0</span></label>
      <input type="range" id="envStrength" min="0.3" max="2.5" step="0.05" value="1"
             oninput="setStrength(this.value)">
      <label class="head">Rotation <span id="envRotVal">0°</span></label>
      <input type="range" id="envRot" min="0" max="360" step="5" value="0"
             oninput="setRotation(this.value)">
      <label class="tgl"><input type="checkbox" id="autoRotate" checked
             onchange="$('viewer').autoRotate=this.checked"> Auto rotate</label>
      <label class="tgl"><input type="checkbox" id="showSky"
             onchange="setSkybox(this.checked)"> Show background</label>
    </div>

    <div class="card" id="viewPanel">
      <div class="cardHead">View settings<span onclick="togglePanel('viewPanel')">✕</span></div>
      <label class="head">Material</label>
      <div class="mats" id="mats"></div>
      <label class="head">Metallic <span id="metVal">–</span></label>
      <input type="range" id="metallic" min="0" max="1" step="0.01" value="1"
             oninput="setPbr('metallic', this.value)">
      <label class="head">Roughness <span id="rghVal">–</span></label>
      <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.5"
             oninput="setPbr('roughness', this.value)">
      <label class="head">Exposure <span id="expVal">1.0</span></label>
      <input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="1"
             oninput="setExposure(this.value)">
      <label class="head">Shadow <span id="shdVal">1.0</span></label>
      <input type="range" id="shadow" min="0" max="2" step="0.05" value="1"
             oninput="$('viewer').shadowIntensity=+this.value; $('shdVal').textContent=(+this.value).toFixed(1)">
      <button class="ghostBtn" style="margin-top:4px" onclick="resetMaterial()">reset material</button>
    </div>

    <div class="card" id="refPanel">
      <div class="cardHead">Reference<span onclick="togglePanel('refPanel')">✕</span></div>
      <img id="refImg" alt="input reference">
      <div id="refNote" class="dimNote"></div>
    </div>

    <div id="lightBar">
      <div id="lightMsg"></div>
      <div class="chips" id="lightChips"></div>
      <div id="envToggle">
        <button id="envOff" onclick="applyEnv('off')">Off</button>
        <button id="envDefault" onclick="applyEnv('default')">Default</button>
        <button id="envAi" class="on" onclick="applyEnv('ai')">✨ AI</button>
      </div>
    </div>
    <div id="theater">
      <h2>🎬 The crew is working on it…</h2>
      <div id="feed"></div>
      <div id="theaterBar">
        <span id="theaterStatus" class="sys">starting…</span>
        <button class="ghostBtn" onclick="toggleTheater(false)">show viewer</button>
      </div>
    </div>
  </div>

  <div id="right" class="panel">
    <h2>Versions</h2>
    <div id="runs"></div>
  </div>
</main>

<script>
const ICONS = {Orchestrator:"🧠", Guardian:"🛡️", Analyst:"🔎", PromptSmith:"✍️",
  ImageGen:"🎨", Preprocessor:"🪄", Gatekeeper:"🛡️", MeshGen:"🧊", Judge:"⚖️",
  TextureSmith:"🖌️", Exporter:"📦", Narrator:"🎙️", LightSmith:"💡"};
let currentRun = null, nextIdx = 0, pollTimer = null, imageFile = null;

const $ = id => document.getElementById(id);

/* ---------- input handling ---------- */
$("drop").onclick = () => $("file").click();
$("file").onchange = e => setImage(e.target.files[0]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("armed"); };
$("drop").ondragleave = () => $("drop").classList.remove("armed");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("armed"); setImage(e.dataTransfer.files[0]); };
function setImage(f) {
  if (!f) return;
  imageFile = f;
  const r = new FileReader();
  r.onload = e => $("drop").innerHTML = `<img src="${e.target.result}">`;
  r.readAsDataURL(f);
}

/* ---------- generate ---------- */
$("goBtn").onclick = async () => {
  const text = $("prompt").value.trim();
  if (!text && !imageFile) { $("guardMsg").textContent = "give me a prompt or an image first"; return; }
  $("guardMsg").textContent = "";
  const fd = new FormData();
  if (text) fd.append("text", text);
  if (imageFile) fd.append("image", imageFile);
  fd.append("mesh_model", $("backend").value);
  fd.append("texture", $("texture").checked);
  fd.append("candidates", $("candidates").value);
  $("goBtn").disabled = true;
  try {
    const res = await fetch("/api/generate", { method: "POST", body: fd });
    const body = await res.json();
    if (!res.ok) { $("guardMsg").textContent = body.detail || "failed to start"; $("goBtn").disabled = false; return; }
    startWatching(body.run_id);
  } catch (e) {
    $("guardMsg").textContent = "server unreachable: " + e; $("goBtn").disabled = false;
  }
};

function startWatching(runId) {
  currentRun = runId; nextIdx = 0;
  $("feed").innerHTML = "";
  toggleTheater(true);
  $("theaterStatus").textContent = runId;
  pollTimer = setInterval(() => { pollEvents(); pollQuestion(); }, 1200);
  loadRuns();
}

async function pollEvents() {
  if (!currentRun) return;
  try {
    const res = await fetch(`/api/runs/${currentRun}/events?after=${nextIdx}`);
    if (!res.ok) return;
    const body = await res.json();
    body.events.forEach(renderEvent);
    nextIdx = body.next;
    if (body.done) finishRun();
  } catch (e) { /* transient */ }
}

function renderEvent(ev) {
  const feed = $("feed");
  if (ev.type === "progress") { $("theaterStatus").textContent = `${ICONS[ev.agent] || ""} ${ev.message}`; return; }
  if (ev.type === "status") {
    if (ev.message === "started") appendSys(`${ICONS[ev.agent] || ""} ${ev.agent} steps up`);
    else if (ev.message === "done") appendSys(`${ICONS[ev.agent] || ""} ${ev.agent} finished ${ev.data.elapsed ? "in " + ev.data.elapsed + "s" : ""}`);
    else appendBubble(ev.agent, ev.message, "err");
    return;
  }
  if (ev.type === "question") { renderQuestion(ev.data || ev); return; }
  if (ev.type === "narration") { appendBubble("Narrator", ev.message, "narr"); return; }
  if (ev.type === "error") { appendBubble(ev.agent, ev.message, "err"); return; }
  if (["log", "decision", "artifact"].includes(ev.type)) {
    const b = appendBubble(ev.agent, ev.message);
    const p = ev.data && ev.data.path;
    if (p && /\.(png|gif|jpg)$/i.test(p)) {
      const rel = p.split(/results[\\\/]/)[1];
      if (rel) { const img = document.createElement("img"); img.src = "/files/" + rel.replace(/\\/g, "/"); b.appendChild(img); }
    }
  }
}

let workingBubble = null;
function appendBubble(agent, msg, cls) {
  // the previous line is finished the moment a new one arrives
  if (workingBubble) { workingBubble.classList.remove("working"); workingBubble = null; }
  const d = document.createElement("div");
  d.className = "bubble" + (cls ? " " + cls : "");
  const txt = document.createElement("span");
  txt.className = "txt";
  txt.textContent = msg;
  d.innerHTML = `<div class="who">${ICONS[agent] || "·"} ${agent}</div>`;
  d.appendChild(txt);
  const dots = document.createElement("span");
  dots.className = "dots";
  d.appendChild(dots);
  $("feed").appendChild(d);
  $("feed").scrollTop = $("feed").scrollHeight;
  // only live work shimmers; narration and errors are finished statements
  if (!cls) { d.classList.add("working"); workingBubble = d; }
  return d;
}
/* ---------- interactive questions from agents ---------- */
const shownQuestions = new Set();

function renderQuestion(q) {
  if (!q || !q.id || shownQuestions.has(q.id)) return;
  shownQuestions.add(q.id);
  if (workingBubble) { workingBubble.classList.remove("working"); workingBubble = null; }
  toggleTheater(true);

  const card = document.createElement("div");
  card.className = "qcard";
  card.id = "q_" + q.id;
  card.innerHTML = `<div class="who">${ICONS[q.agent] || "❓"} ${q.agent} needs your call</div>
                    <div class="qtext"></div>`;
  card.querySelector(".qtext").textContent = q.text;

  if (q.model) {
    const mv = document.createElement("model-viewer");
    mv.setAttribute("camera-controls", "");
    mv.setAttribute("auto-rotate", "");
    mv.setAttribute("shadow-intensity", "1");
    mv.src = q.model;
    card.appendChild(mv);
  }
  if (q.images && q.images.length) {
    const shots = document.createElement("div");
    shots.className = "qshots";
    q.images.forEach(src => { const i = document.createElement("img"); i.src = src; shots.appendChild(i); });
    card.appendChild(shots);
  }

  const btns = document.createElement("div");
  btns.className = "qbtns";
  (q.options || []).forEach(opt => {
    const b = document.createElement("button");
    b.textContent = opt.label;
    if (opt.primary) b.className = "primary";
    b.onclick = () => answerQuestion(q.id, opt.value, card, opt.label);
    btns.appendChild(b);
  });
  card.appendChild(btns);

  const timer = document.createElement("div");
  timer.className = "qtimer";
  card.appendChild(timer);
  let left = Math.round(q.timeout || 240);
  const tick = setInterval(() => {
    left--;
    if (card.classList.contains("answered") || left <= 0) { clearInterval(tick); return; }
    timer.textContent = `continues automatically with "${q.default}" in ${left}s`;
  }, 1000);

  $("feed").appendChild(card);
  $("feed").scrollTop = $("feed").scrollHeight;
}

async function answerQuestion(id, choice, card, label) {
  card.classList.add("answered");
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  const fd = new FormData();
  fd.append("question_id", id);
  fd.append("choice", choice);
  try {
    const res = await fetch("/api/answer", {method: "POST", body: fd});
    if (!res.ok) throw new Error();
    appendSys(`you chose: ${label}`);
  } catch (e) {
    appendSys("that question already timed out");
  }
}

async function pollQuestion() {
  if (!currentRun) return;
  try {
    const res = await fetch("/api/question");
    if (!res.ok) return;
    const body = await res.json();
    if (body.question) renderQuestion(body.question);
  } catch (e) { /* transient */ }
}

function appendSys(msg) {
  const d = document.createElement("div");
  d.className = "sys"; d.textContent = msg;
  $("feed").appendChild(d);
  $("feed").scrollTop = $("feed").scrollHeight;
}

async function finishRun() {
  clearInterval(pollTimer); pollTimer = null;
  $("goBtn").disabled = false;
  if (workingBubble) { workingBubble.classList.remove("working"); workingBubble = null; }
  appendSys("✨ run finished");
  $("theaterStatus").textContent = "finished - loading result…";
  const finished = currentRun; currentRun = null;
  await loadRuns();
  const runs = lastRuns.filter(r => r.run_id === finished);
  if (runs.length && runs[0].models.length) {
    const best = pickBest(runs[0].models);
    loadModel(best.file, finished);
    setTimeout(() => toggleTheater(false), 1600);
  }
}

function pickBest(models) {
  const order = ["Textured", "Hunyuan", "Mesh", "TripoSR"];
  for (const label of order) { const m = models.find(x => x.label === label); if (m) return m; }
  return models[0];
}

function toggleTheater(open) { $("theater").classList.toggle("open", open); }
function loadModel(url, runId) {
  $("viewer").src = url;
  document.querySelectorAll(".mbtn").forEach(b => b.classList.toggle("active", b.dataset.file === url));
  const id = runId || (url.match(/\/files\/([^/]+)\//) || [])[1];
  if (id) requestLighting(id);
}

/* ---------- environment: paint an equirectangular map from a lighting rig ----------
   three.js samples an equirect map as u = atan2(dir.z, dir.x)/2PI + 0.5, and the camera
   sits on +Z, so the model's front is u = 0.75. Azimuth 0 = front, 90 = its right.      */
function azimuthToU(azimuthDeg) {
  return (((0.75 - azimuthDeg / 360) % 1) + 1) % 1;
}

function buildEnvironment(rig, opts = {}) {
  const strength = opts.strength ?? envStrength;
  const rotation = opts.rotation ?? envRotation;
  const W = 1024, H = 512;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");

  // Sky gradient, floored so a "black set" rig still carries base energy - with
  // image-based lighting a truly black map leaves whole faces of the model unlit.
  const top = liftColor(rig.background.top, 0.16);
  const bottom = liftColor(rig.background.bottom, 0.10);
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, top);
  grad.addColorStop(0.5, top);
  grad.addColorStop(1, bottom);
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  g.globalCompositeOperation = "lighter";
  // soft overhead wash: keeps upward-facing surfaces alive
  const sky = g.createRadialGradient(W / 2, 0, 0, W / 2, 0, H * 0.9);
  sky.addColorStop(0, `rgba(255,255,255,${0.20 * strength})`);
  sky.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  for (const L of rig.lights) {
    const x = azimuthToU(L.azimuth + rotation) * W;
    const y = (0.5 - L.elevation / 180) * H;
    const r = Math.max(30, L.size * W * 0.55);
    const [cr, cg, cb] = hexRgb(L.color);
    // draw twice for intensities above 1 so bright keys really do read as bright
    const passes = L.intensity > 1 ? 2 : 1;
    const a = Math.min(1, (L.intensity / passes) * strength);
    for (let p = 0; p < passes; p++) {
      for (const cx of [x - W, x, x + W]) {   // wrap across the seam
        const blob = g.createRadialGradient(cx, y, 0, cx, y, r);
        blob.addColorStop(0, `rgba(${cr},${cg},${cb},${a})`);
        blob.addColorStop(0.4, `rgba(${cr},${cg},${cb},${a * 0.45})`);
        blob.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
        g.fillStyle = blob;
        g.beginPath(); g.arc(cx, y, r, 0, 6.284); g.fill();
      }
    }
  }
  g.globalCompositeOperation = "source-over";
  return c.toDataURL("image/png");
}

function hexRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
/** Raise a colour to at least `floor` luminance, keeping its hue. */
function liftColor(hex, floor) {
  let [r, g, b] = hexRgb(hex);
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  if (lum < floor) {
    const add = (floor - lum) * 255;
    r = Math.min(255, r + add); g = Math.min(255, g + add); b = Math.min(255, b + add);
  }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* built-in surroundings, so the viewer is useful even before the agent replies */
const ENV_PRESETS = {
  studio: {preset_name: "Studio", background: {top: "#3a3f47", bottom: "#15181d"},
    exposure: 1.15, shadow_intensity: 1.0,
    rationale: "Neutral three-point studio - true colours, clean falloff.",
    lights: [{role: "key", color: "#ffffff", azimuth: -35, elevation: 40, intensity: 1.2, size: 0.42},
             {role: "fill", color: "#dce6ff", azimuth: 70, elevation: 12, intensity: 0.6, size: 0.6},
             {role: "rim", color: "#ffffff", azimuth: 175, elevation: 28, intensity: 0.9, size: 0.3}]},
  sunset: {preset_name: "Sunset", background: {top: "#3d2b3f", bottom: "#1d1420"},
    exposure: 1.2, shadow_intensity: 1.0,
    rationale: "Warm low key with a violet sky - flattering golden-hour look.",
    lights: [{role: "key", color: "#ffb469", azimuth: -40, elevation: 14, intensity: 1.35, size: 0.45},
             {role: "fill", color: "#6f7bd8", azimuth: 80, elevation: 30, intensity: 0.55, size: 0.6},
             {role: "rim", color: "#ffd9a0", azimuth: 160, elevation: 20, intensity: 1.0, size: 0.3}]},
  night: {preset_name: "Night Neon", background: {top: "#161a2b", bottom: "#080a12"},
    exposure: 1.25, shadow_intensity: 1.1,
    rationale: "Dark set with saturated rims - punchy for vehicles and hard surfaces.",
    lights: [{role: "key", color: "#ffffff", azimuth: -30, elevation: 45, intensity: 1.25, size: 0.3},
             {role: "fill", color: "#2f6bff", azimuth: 85, elevation: 10, intensity: 0.75, size: 0.5},
             {role: "rim", color: "#ff4fa8", azimuth: 165, elevation: 22, intensity: 1.2, size: 0.26}]},
  soft: {preset_name: "Soft Daylight", background: {top: "#e9edf2", bottom: "#b9c0c9"},
    exposure: 1.0, shadow_intensity: 0.7,
    rationale: "Bright overcast light - shows true material colour with open shadows.",
    lights: [{role: "key", color: "#ffffff", azimuth: -25, elevation: 55, intensity: 1.1, size: 0.6},
             {role: "fill", color: "#ffffff", azimuth: 75, elevation: 20, intensity: 0.8, size: 0.65},
             {role: "rim", color: "#ffffff", azimuth: 170, elevation: 30, intensity: 0.6, size: 0.45}]},
};

let lightingData = null, envMode = "ai", envStrength = 1, envRotation = 0, envCustom = null;

function currentRig() {
  if (envCustom) return ENV_PRESETS[envCustom];
  if (!lightingData) return ENV_PRESETS.studio;
  return lightingData[envMode] || lightingData.default;
}

function applyEnv(mode) {
  if (mode) { envMode = mode; envCustom = null; $("envPreset").value = mode === "ai" ? "ai" : "studio"; }
  const v = $("viewer");

  if (envMode === "off" && !envCustom) {
    // hand back to model-viewer's own neutral lighting - the brightest, flattest look
    v.environmentImage = "neutral";
    v.skyboxImage = null;
    v.exposure = 1.0;
    v.shadowIntensity = 0.8;
    $("center").style.background = "radial-gradient(ellipse at 50% 40%,#1a2233 0%,#0d1117 70%)";
    $("envPreview").src = "";
    $("lightChips").innerHTML = "";
    markEnvButtons();
    $("lightMsg").innerHTML = "<b>Lighting off</b> — model-viewer's flat neutral environment.";
    return;
  }

  const rig = currentRig();
  const map = buildEnvironment(rig);
  v.environmentImage = map;
  if ($("showSky").checked) v.skyboxImage = map;
  v.exposure = rig.exposure * envStrength;
  v.shadowIntensity = rig.shadow_intensity;
  $("exposure").value = Math.min(2.5, rig.exposure * envStrength);
  $("expVal").textContent = (rig.exposure * envStrength).toFixed(1);
  $("shadow").value = rig.shadow_intensity;
  $("shdVal").textContent = rig.shadow_intensity.toFixed(1);
  $("envPreview").src = map;
  $("center").style.background =
    `radial-gradient(ellipse at 50% 40%, ${liftColor(rig.background.top, 0.08)} 0%, ${rig.background.bottom} 78%)`;
  $("lightChips").innerHTML = rig.lights
    .map(L => `<div class="chip" style="background:${L.color}" title="${L.role} @ ${L.azimuth}°"></div>`).join("");
  markEnvButtons();
  showLighting(rig, envCustom ? "preset" : envMode);
}

function markEnvButtons() {
  const active = envCustom ? null : envMode;
  $("envAi").classList.toggle("on", active === "ai");
  $("envDefault").classList.toggle("on", active === "default");
  $("envOff").classList.toggle("on", active === "off");
}

function setPreset(name) {
  if (name === "ai") { envCustom = null; applyEnv("ai"); return; }
  if (name === "off") { envCustom = null; applyEnv("off"); return; }
  envCustom = name;
  applyEnv();
}
function setStrength(v) { envStrength = +v; $("envStrengthVal").textContent = (+v).toFixed(1); applyEnv(); }
function setRotation(v) { envRotation = +v; $("envRotVal").textContent = v + "°"; applyEnv(); }
function setSkybox(on) { const v = $("viewer"); v.skyboxImage = on ? $("envPreview").src || null : null; }
function setExposure(v) { $("viewer").exposure = +v; $("expVal").textContent = (+v).toFixed(1); }
function togglePanel(id) {
  document.querySelectorAll(".card").forEach(c => {
    if (c.id === id) c.classList.toggle("open"); else c.classList.remove("open");
  });
}

/* ---------- material presets (model-viewer's official PBR API) ---------- */
const MATERIALS = [
  {name: "Original", swatch: "linear-gradient(135deg,#9ad,#568)", reset: true},
  {name: "Clay", swatch: "#c9b6a4", base: [0.79, 0.71, 0.64, 1], metallic: 0, roughness: 0.9},
  {name: "Matte white", swatch: "#e8e8e8", base: [0.91, 0.91, 0.91, 1], metallic: 0, roughness: 0.75},
  {name: "Chrome", swatch: "linear-gradient(135deg,#fff,#8a94a6)", base: [0.95, 0.96, 1, 1], metallic: 1, roughness: 0.08},
  {name: "Gold", swatch: "linear-gradient(135deg,#ffe08a,#c8951f)", base: [1, 0.77, 0.34, 1], metallic: 1, roughness: 0.22},
  {name: "Toon", swatch: "#7ee0c8", base: null, metallic: 0, roughness: 1.0},
];
let originalPbr = null, activeMat = 0;

function buildMatButtons() {
  $("mats").innerHTML = "";
  MATERIALS.forEach((m, i) => {
    const b = document.createElement("div");
    b.className = "mat" + (i === activeMat ? " on" : "");
    b.style.background = m.swatch;
    b.title = m.name;
    b.onclick = () => applyMaterial(i);
    $("mats").appendChild(b);
  });
}

function modelMaterials() {
  const m = $("viewer").model;
  return (m && m.materials) ? m.materials : [];
}

function rememberOriginal() {
  const mats = modelMaterials();
  if (!mats.length) return;
  originalPbr = mats.map(mt => ({
    base: [...mt.pbrMetallicRoughness.baseColorFactor],
    metallic: mt.pbrMetallicRoughness.metallicFactor,
    roughness: mt.pbrMetallicRoughness.roughnessFactor,
  }));
  const first = originalPbr[0];
  $("metallic").value = first.metallic; $("metVal").textContent = first.metallic.toFixed(2);
  $("roughness").value = first.roughness; $("rghVal").textContent = first.roughness.toFixed(2);
}

function applyMaterial(i) {
  const mats = modelMaterials();
  if (!mats.length) return;
  const preset = MATERIALS[i];
  activeMat = i;
  buildMatButtons();
  mats.forEach((mt, k) => {
    const pbr = mt.pbrMetallicRoughness;
    if (preset.reset) {
      const o = originalPbr && originalPbr[k];
      if (o) { pbr.setBaseColorFactor(o.base); pbr.setMetallicFactor(o.metallic); pbr.setRoughnessFactor(o.roughness); }
      return;
    }
    if (preset.base) pbr.setBaseColorFactor(preset.base);
    else if (originalPbr && originalPbr[k]) pbr.setBaseColorFactor(originalPbr[k].base);
    pbr.setMetallicFactor(preset.metallic);
    pbr.setRoughnessFactor(preset.roughness);
  });
  $("metallic").value = preset.metallic ?? 0; $("metVal").textContent = (preset.metallic ?? 0).toFixed(2);
  $("roughness").value = preset.roughness ?? 0.5; $("rghVal").textContent = (preset.roughness ?? 0.5).toFixed(2);
}

function setPbr(which, value) {
  modelMaterials().forEach(mt => {
    if (which === "metallic") mt.pbrMetallicRoughness.setMetallicFactor(+value);
    else mt.pbrMetallicRoughness.setRoughnessFactor(+value);
  });
  $(which === "metallic" ? "metVal" : "rghVal").textContent = (+value).toFixed(2);
}
function resetMaterial() { applyMaterial(0); }

function showLighting(rig, mode) {
  if (mode === "default") {
    $("lightMsg").innerHTML = "<b>Default</b> — neutral three-point studio, no analysis applied.";
    return;
  }
  const lines = [`<b>💡 LightSmith → “${rig.preset_name}”</b> ${rig.rationale}`]
    .concat((rig.commentary || []).map(c => "· " + c));
  typeLines($("lightMsg"), lines);
}

let typeTimer = null;
function typeLines(el, lines) {
  clearTimeout(typeTimer);
  let i = 0;
  const step = () => {
    el.innerHTML = lines.slice(0, i + 1).join("<br>");
    if (++i < lines.length) typeTimer = setTimeout(step, 1400);
  };
  step();
}

async function loadReference(runId) {
  const r = lastRuns.find(x => x.run_id === runId);
  const img = $("refImg"), note = $("refNote");
  const shot = (r && r.previews && r.previews[0]) || null;
  const inputUrl = `/files/${runId}/intermediate/processed_input.png`;
  img.onerror = () => { img.src = shot || ""; note.textContent = "generated preview (no source image)"; };
  img.onload = () => { if (img.src.includes("processed_input")) note.textContent = "the image the 3D model was built from"; };
  img.src = inputUrl;
}

async function requestLighting(runId) {
  loadReference(runId);
  if (lightingData && lightingData.run === runId) { applyEnv(envMode); return; }
  lightingData = null;
  $("envAi").disabled = true;
  $("lightMsg").innerHTML = '<span class="live">💡 LightSmith is studying the model to design its lighting</span>';
  try {
    const res = await fetch(`/api/runs/${runId}/lighting`);
    if (!res.ok) throw new Error("lighting unavailable");
    const data = await res.json();
    data.run = runId;
    lightingData = data;
    applyEnv(envMode);
  } catch (e) {
    $("lightMsg").textContent = "lighting agent unavailable — using the viewer default";
  } finally {
    $("envAi").disabled = false;
  }
}

/* ---------- runs list ---------- */
let lastRuns = [];
async function loadRuns() {
  try {
    const res = await fetch("/api/runs");
    lastRuns = (await res.json()).runs;
  } catch (e) { return; }
  const el = $("runs");
  el.innerHTML = "";
  lastRuns.forEach(r => {
    const d = document.createElement("div");
    d.className = "run";
    const when = new Date(r.mtime * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    const scoreHtml = r.score != null
      ? `<span class="score" style="background:${r.score >= .55 ? "var(--good)" : "var(--warn)"}">${r.score.toFixed(2)}</span>` : "";
    d.innerHTML = `<div class="title">${r.run_id.split("_").slice(2).join("_") || r.run_id}</div>
      <div class="meta">${when} ${scoreHtml} ${r.status === "running" ? '<span class="running-tag">● running</span>' : ""}</div>`;
    const models = document.createElement("div");
    models.className = "models";
    r.models.forEach(m => {
      const b = document.createElement("button");
      b.className = "mbtn" + (m.label === "Textured" ? " tex" : "");
      b.textContent = m.label === "Textured" ? "✨ " + m.label : m.label;
      b.dataset.file = m.file;
      b.onclick = () => { loadModel(m.file, r.run_id); toggleTheater(false); };
      models.appendChild(b);
    });
    d.appendChild(models);
    if (r.previews.length) {
      const t = document.createElement("div");
      t.className = "thumbs";
      r.previews.slice(0, 5).forEach(p => { const i = document.createElement("img"); i.src = p; t.appendChild(i); });
      d.appendChild(t);
    }
    el.appendChild(d);
  });
}

/* ---------- status poll + boot ---------- */
async function pollStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    $("statusDot").classList.toggle("busy", s.busy);
    $("statusText").textContent = s.busy ? "generating " + (s.run_id || "") : "idle";
    if (s.busy && s.run_id && !pollTimer && !currentRun) startWatching(s.run_id); // reattach after refresh
    if (s.busy) $("goBtn").disabled = true;
    else if (!currentRun) $("goBtn").disabled = false;
  } catch (e) { $("statusText").textContent = "server offline"; }
}
// material controls only become meaningful once a model's materials exist
$("viewer").addEventListener("load", () => {
  originalPbr = null;
  activeMat = 0;
  rememberOriginal();
  buildMatButtons();
});
buildMatButtons();

setInterval(pollStatus, 2500);
pollStatus();
loadRuns().then(() => {
  const withModels = lastRuns.find(r => r.models.length);
  if (withModels) loadModel(pickBest(withModels.models).file, withModels.run_id);
});
</script>
